<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>DeveloperX — Veo</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  body {
    width: 280px;
    font-family: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
    color: #eef1f8;
    background: transparent;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }


  .wrap { padding: 10px; position: relative; z-index:2; }

  /* animated orbs */
  .orb { position:absolute; border-radius:50%; filter: blur(42px); pointer-events:none; z-index:1; }
  .orb.a { width:220px; height:220px; top:-100px; right:-80px; background:#7c5cfc; opacity:.55; animation: drift1 12s ease-in-out infinite; }
  .orb.b { width:200px; height:200px; bottom:-110px; left:-80px; background:#22d3ee; opacity:.5; animation: drift2 14s ease-in-out infinite; }
  .orb.c { width:140px; height:140px; top:38%; left:38%; background:#f472b6; opacity:.28; animation: drift1 20s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-22px,26px) scale(1.1)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(24px,-22px) scale(1.12)} }

  /* header */
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:14px; position:relative; z-index:2; }
  .brand .logo {
    width:44px; height:44px; border-radius:13px;
    padding:2px;
    background: conic-gradient(from 210deg, #7c5cfc, #22d3ee, #f472b6, #fbbf24, #7c5cfc);
    display:grid; place-items:center;
    box-shadow: 0 12px 30px rgba(124,92,252,.55), 0 0 0 1px rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.2);
    position:relative;
  }
  .brand .logo::after {
    content:""; position:absolute; inset:-5px; border-radius:18px; pointer-events:none;
    background: conic-gradient(from 0deg, rgba(124,92,252,.55), rgba(34,211,238,.55), rgba(244,114,182,.55), rgba(251,191,36,.55), rgba(124,92,252,.55));
    filter: blur(12px); opacity:.5; z-index:-1;
  }
  .brand .logo img { width:100%; height:100%; border-radius:11px; display:block; object-fit:cover;
    background:#0a0a14; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); }
  .brand h1 { font-size: 13.5px; margin: 0; font-weight: 800; letter-spacing:-.2px; line-height:1.15;
    background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; }
  .brand small { color: #96a0b8; font-size: 10px; font-weight:500; letter-spacing:.2px; }

  /* card with animated rotating gradient border on all 4 sides */
  @property --dx-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  .card {
    position:relative;
    background: linear-gradient(180deg, rgba(20,15,40,.9), rgba(10,8,20,.92));
    border-radius: 18px;
    padding: 14px;
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: 0 20px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    z-index:1;
  }
  .card::before {
    content:""; position:absolute; inset:-2px; border-radius:20px; padding:2px;
    background: conic-gradient(from var(--dx-angle,0deg),
      #7c5cfc,#22d3ee,#34d399,#fbbf24,#f472b6,#7c5cfc);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: dx-spin 4s linear infinite;
    pointer-events:none; z-index:-1;
    filter: drop-shadow(0 0 6px rgba(124,92,252,.55));
  }
  .card::after {
    content:""; position:absolute; inset:-6px; border-radius:22px; pointer-events:none;
    background: conic-gradient(from var(--dx-angle,0deg),
      rgba(124,92,252,.55),rgba(34,211,238,.55),rgba(52,211,153,.55),rgba(251,191,36,.55),rgba(244,114,182,.55),rgba(124,92,252,.55));
    filter: blur(14px); opacity:.55; z-index:-2;
    animation: dx-spin 4s linear infinite;
  }
  @keyframes dx-spin { to { --dx-angle: 360deg; } }
  @supports not (background: conic-gradient(from 0deg, red, blue)) {
    .card::before, .card::after { display:none; }
    .card { border:1px solid rgba(255,255,255,.11); }
  }

  label { display:block; font-size:9.5px; color:#96a0b8; margin:10px 0 5px; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  label:first-of-type { margin-top:0; }
  input {
    width:100%; padding:11px 13px; font-size:12.5px;
    background: rgba(0,0,0,.4); color:#eef1f8;
    border:1px solid rgba(255,255,255,.09); border-radius:11px; outline:none;
    transition: border .2s, box-shadow .2s, background .2s;
    font-family:inherit;
  }
  input:focus { border-color:#7c5cfc; background:rgba(0,0,0,.55); box-shadow:0 0 0 3px rgba(124,92,252,.25); }

  .btn {
    width:100%; padding:12px; font-size:12.5px; font-weight:800; letter-spacing:.3px;
    border:0; border-radius:12px; cursor:pointer; font-family:inherit;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s;
    color:#fff; position:relative; overflow:hidden;
  }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn.primary { background: linear-gradient(135deg,#7c5cfc,#5a3fe0); box-shadow: 0 10px 24px rgba(124,92,252,.5), inset 0 1px 0 rgba(255,255,255,.22); }
  .btn.primary:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(124,92,252,.7); }
  .btn.inject { background: linear-gradient(135deg,#22d3ee,#0891b2); box-shadow: 0 10px 24px rgba(34,211,238,.5), inset 0 1px 0 rgba(255,255,255,.22); }
  .btn.inject:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(34,211,238,.65); }
  .btn.ghost { background: rgba(255,255,255,.06); color:#dfe3ee; border:1px solid rgba(255,255,255,.1); font-weight:700; }
  .btn.ghost:hover { background: rgba(255,255,255,.1); }
  .btn::after {
    content:""; position:absolute; inset:0; border-radius:12px;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform .6s;
  }
  .btn:not(:disabled):hover::after { transform: translateX(100%); }

  .mt-8 { margin-top:8px; } .mt-10{ margin-top:10px; } .mt-12 { margin-top:12px; }
  .err { color:#f87171; font-size:11px; margin-top:6px; min-height:12px; }

  .head-row { display:flex; align-items:center; justify-content:space-between; gap:8px; position:relative; z-index:1; }
  .head-row .name { font-weight:800; font-size:13.5px; line-height:1.2; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; }
  .head-row .mail { color:#828ba3; font-size:10.5px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .badge {
    display:inline-flex; align-items:center; padding:5px 10px; font-size:9px; border-radius:999px;
    background: rgba(124,92,252,.25); color:#c4b5fd;
    text-transform:uppercase; font-weight:800; letter-spacing:.8px;
    border:1px solid rgba(124,92,252,.45);
    box-shadow: 0 4px 12px rgba(124,92,252,.2);
  }
  .badge.warn { background:rgba(240,185,11,.2); color:#fbbf24; border-color:rgba(240,185,11,.45); box-shadow:0 4px 12px rgba(240,185,11,.2);}
  .badge.danger { background:rgba(239,68,68,.24); color:#f87171; border-color:rgba(239,68,68,.45); box-shadow:0 4px 12px rgba(239,68,68,.25);}
  .badge.ok { background:rgba(34,211,153,.2); color:#34d399; border-color:rgba(34,197,153,.45); box-shadow:0 4px 12px rgba(34,197,153,.2);}

  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; position:relative; z-index:1; }
  .kpi > div {
    padding:11px 12px; border-radius:14px;
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.1);
    position:relative; overflow:hidden;
  }
  .kpi > div::after {
    content:""; position:absolute; top:-30%; right:-30%; width:80%; height:120%;
    background: radial-gradient(circle, rgba(124,92,252,.25), transparent 70%);
    pointer-events:none;
  }
  .kpi .t { font-size:9px; color:#96a0b8; text-transform:uppercase; letter-spacing:.7px; font-weight:700; display:flex; align-items:center; gap:5px; }
  .kpi .v { font-size:18px; font-weight:800; margin-top:5px; letter-spacing:-.4px; font-variant-numeric: tabular-nums; position:relative; z-index:1;}
  .kpi .v.glow { background: linear-gradient(135deg,#c4b5fd,#67e8f9); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .kpi .v.time { font-size:16.5px; background: linear-gradient(135deg,#67e8f9,#22d3ee); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  .pbar {
    width:100%; height:6px; background:rgba(255,255,255,.06);
    border-radius:99px; overflow:hidden; margin-top:14px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
    position:relative; z-index:1;
  }
  .pbar > i {
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#7c5cfc 0%,#22d3ee 60%,#7c5cfc 100%);
    background-size:200% 100%;
    border-radius:99px;
    transition: width .6s cubic-bezier(.4,0,.2,1);
    animation: slide 6s linear infinite;
    box-shadow: 0 0 14px rgba(124,92,252,.55);
  }
  @keyframes slide { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

  .cta {
    display:block; margin-top:12px; padding:11px;
    background: linear-gradient(135deg,#25d366,#128c7e);
    color:#fff; border-radius:12px; text-align:center; font-weight:800;
    text-decoration:none; font-size:11.5px;
    box-shadow: 0 10px 22px rgba(37,211,102,.35);
    transition: transform .15s;
    position:relative; z-index:1;
  }
  .cta:hover { transform: translateY(-1px); }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; position:relative; z-index:1; }

  .hidden { display:none !important; }
  .status-note { font-size:10.5px; color:#96a0b8; margin-top:10px; min-height:12px; text-align:center; position:relative; z-index:1;}

  .live { display:inline-flex; align-items:center; gap:5px; font-size:9px; color:#34d399; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .live .dot { width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 10px #34d399; animation: soft-pulse 2s ease-in-out infinite; }
  @keyframes soft-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* tip footer */
  .tip { margin-top:10px; padding:9px 11px; border-radius:10px;
    background:rgba(240,185,11,.08); border:1px solid rgba(240,185,11,.2);
    color:#fcd97a; font-size:10px; line-height:1.4; position:relative; z-index:1; }
  .tip b { color:#fbbf24; }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <div class="wrap">
    <div class="brand">
      <div class="logo"><img src="logo.png" alt="DeveloperX" /></div>
      <div>
        <h1>DeveloperX · Veo</h1>
        <small>Google Flow · Managed Session</small>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="view-login" class="card">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button id="login-btn" class="btn primary mt-12">Sign in</button>
      <div id="login-err" class="err"></div>
      <input id="api-base" type="hidden" />
    </div>

    <!-- STATUS -->
    <div id="view-status" class="card hidden">
      <div class="head-row">
        <div style="min-width:0">
          <div id="s-name" class="name">—</div>
          <div id="s-email" class="mail">—</div>
        </div>
        <span id="s-plan" class="badge">basic</span>
      </div>

      <div class="kpi">
        <div>
          <div class="t">💎 Credits</div>
          <div class="v glow" id="s-credits">—</div>
        </div>
        <div>
          <div class="t"><span class="live"><span class="dot"></span> Live</span></div>
          <div class="v time" id="s-time">--:--:--</div>
        </div>
      </div>
      <div class="pbar"><i id="s-bar"></i></div>

      <div id="s-alert" class="err" style="color:#fbbf24"></div>

      <a id="s-upgrade" class="cta hidden" href="https://wa.me/8801410014442" target="_blank">💬 Buy credits · WhatsApp</a>

      <div class="actions">
        <button id="inject-flow" class="btn inject">🚀 Inject Flow</button>
        <button id="open-flow" class="btn primary">🌐 Open Flow</button>
      </div>
      <div id="inject-status" class="status-note"></div>

      <div class="tip">
        <b>Tip:</b> "Unusual activity" error? Wait 2–3 min, then re-inject. Avoid using VPN while generating.
      </div>

      <button id="logout-btn" class="btn ghost mt-8">Sign out</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
