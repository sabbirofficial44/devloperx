<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>DeveloperX — Veo</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  body {
    width: 320px;
    font-family: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
    color: #eef1f8;
    background:
      radial-gradient(140% 90% at 0% 0%, rgba(124,92,252,.28), transparent 55%),
      radial-gradient(140% 90% at 100% 100%, rgba(34,211,238,.22), transparent 55%),
      linear-gradient(160deg, #0a0b12 0%, #0f0a1e 100%);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 14px; position: relative; z-index:1; }

  /* soft glass orbs, subtle drift */
  .orb { position:absolute; border-radius:50%; filter: blur(38px); pointer-events:none; opacity:.45; z-index:0; }
  .orb.a { width:200px; height:200px; top:-90px; right:-70px; background:#7c5cfc; animation: drift1 14s ease-in-out infinite; }
  .orb.b { width:180px; height:180px; bottom:-90px; left:-70px; background:#22d3ee; animation: drift2 16s ease-in-out infinite; }
  .orb.c { width:120px; height:120px; top:40%; left:40%; background:#f472b6; opacity:.22; animation: drift1 22s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-18px,22px) scale(1.06)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(20px,-18px) scale(1.08)} }

  /* header */
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .brand .logo {
    width:34px; height:34px; border-radius:11px;
    background: conic-gradient(from 210deg, #7c5cfc, #22d3ee, #f472b6, #7c5cfc);
    display:grid; place-items:center; font-weight:900; color:#08090d; font-size:15px;
    box-shadow: 0 8px 22px rgba(124,92,252,.55), inset 0 0 0 1px rgba(255,255,255,.3);
  }
  .brand h1 { font-size: 13px; margin: 0; font-weight: 800; letter-spacing:-.2px; line-height:1.15; }
  .brand small { color: #96a0b8; font-size: 10px; font-weight:500; }

  /* card */
  .card {
    position:relative;
    background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 18px;
    padding: 14px;
    backdrop-filter: blur(24px) saturate(160%);
    box-shadow:
      0 20px 50px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.08);
  }

  label { display:block; font-size:9.5px; color:#96a0b8; margin:8px 0 5px; text-transform:uppercase; letter-spacing:.9px; font-weight:700; }
  input {
    width:100%; padding:10px 12px; font-size:12.5px;
    background: rgba(0,0,0,.35); color:#eef1f8;
    border:1px solid rgba(255,255,255,.09); border-radius:10px; outline:none;
    transition: border .2s, box-shadow .2s, background .2s;
    font-family:inherit;
  }
  input:focus { border-color:#7c5cfc; background:rgba(0,0,0,.5); box-shadow:0 0 0 3px rgba(124,92,252,.22); }

  .btn {
    width:100%; padding:11px; font-size:12.5px; font-weight:800; letter-spacing:.3px;
    border:0; border-radius:11px; cursor:pointer; font-family:inherit;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s;
    color:#fff; position:relative; overflow:hidden;
  }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn.primary { background: linear-gradient(135deg,#7c5cfc,#5a3fe0); box-shadow: 0 8px 22px rgba(124,92,252,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.primary:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(124,92,252,.65); }
  .btn.inject { background: linear-gradient(135deg,#22d3ee,#0891b2); box-shadow: 0 8px 22px rgba(34,211,238,.42), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.inject:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(34,211,238,.6); }
  .btn.ghost { background: rgba(255,255,255,.05); color:#dfe3ee; border:1px solid rgba(255,255,255,.10); font-weight:700; }
  .btn.ghost:hover { background: rgba(255,255,255,.09); }

  .mt-8 { margin-top:8px; } .mt-10{ margin-top:10px; }
  .err { color:#f87171; font-size:11px; margin-top:6px; min-height:12px; }

  .head-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .head-row .name { font-weight:800; font-size:13px; line-height:1.2; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .head-row .mail { color:#828ba3; font-size:10.5px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .badge {
    display:inline-flex; align-items:center; padding:4px 9px; font-size:9px; border-radius:999px;
    background: rgba(124,92,252,.22); color:#c4b5fd;
    text-transform:uppercase; font-weight:800; letter-spacing:.7px;
    border:1px solid rgba(124,92,252,.4);
  }
  .badge.warn { background:rgba(240,185,11,.18); color:#fbbf24; border-color:rgba(240,185,11,.4); }
  .badge.danger { background:rgba(239,68,68,.22); color:#f87171; border-color:rgba(239,68,68,.4); }
  .badge.ok { background:rgba(34,211,153,.18); color:#34d399; border-color:rgba(34,197,153,.4); }

  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .kpi > div {
    padding:10px 11px; border-radius:13px;
    background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.09);
    position:relative; overflow:hidden;
  }
  .kpi .t { font-size:9px; color:#96a0b8; text-transform:uppercase; letter-spacing:.6px; font-weight:700; display:flex; align-items:center; gap:5px; }
  .kpi .v { font-size:17px; font-weight:800; margin-top:4px; letter-spacing:-.4px; font-variant-numeric: tabular-nums; }
  .kpi .v.glow { background: linear-gradient(135deg,#c4b5fd,#67e8f9); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .kpi .v.time { font-size:16px; background: linear-gradient(135deg,#67e8f9,#22d3ee); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  /* smooth progress bar (no jarring shimmer) */
  .pbar {
    width:100%; height:6px; background:rgba(255,255,255,.05);
    border-radius:99px; overflow:hidden; margin-top:12px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.3);
  }
  .pbar > i {
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#7c5cfc 0%,#22d3ee 60%,#7c5cfc 100%);
    background-size:200% 100%;
    border-radius:99px;
    transition: width .6s cubic-bezier(.4,0,.2,1);
    animation: slide 6s linear infinite;
    box-shadow: 0 0 12px rgba(124,92,252,.5);
  }
  @keyframes slide { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

  .cta {
    display:block; margin-top:10px; padding:10px;
    background: linear-gradient(135deg,#f0b90b,#ea8b0b);
    color:#0a0b12; border-radius:11px; text-align:center; font-weight:800;
    text-decoration:none; font-size:11.5px;
    box-shadow: 0 8px 20px rgba(240,185,11,.32);
    transition: transform .15s;
  }
  .cta:hover { transform: translateY(-1px); }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }

  .hidden { display:none !important; }
  .status-note { font-size:10.5px; color:#96a0b8; margin-top:8px; min-height:12px; text-align:center; }

  /* live pill (subtle pulse, no jitter) */
  .live { display:inline-flex; align-items:center; gap:5px; font-size:9px; color:#34d399; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .live .dot { width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 10px #34d399; animation: soft-pulse 2s ease-in-out infinite; }
  @keyframes soft-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <div class="wrap">
    <div class="brand">
      <div class="logo">D</div>
      <div>
        <h1>DeveloperX · Veo</h1>
        <small>Google Flow · Managed Session</small>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="view-login" class="card">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button id="login-btn" class="btn primary mt-10">Sign in</button>
      <div id="login-err" class="err"></div>
      <input id="api-base" type="hidden" />
    </div>

    <!-- STATUS -->
    <div id="view-status" class="card hidden">
      <div class="head-row">
        <div style="min-width:0">
          <div id="s-name" class="name">—</div>
          <div id="s-email" class="mail">—</div>
        </div>
        <span id="s-plan" class="badge">basic</span>
      </div>

      <div class="kpi">
        <div>
          <div class="t">Credits</div>
          <div class="v glow" id="s-credits">—</div>
        </div>
        <div>
          <div class="t"><span class="live"><span class="dot"></span> Live</span></div>
          <div class="v time" id="s-time">--:--:--</div>
        </div>
      </div>
      <div class="pbar"><i id="s-bar"></i></div>

      <div id="s-alert" class="err" style="color:#fbbf24"></div>

      <a id="s-upgrade" class="cta hidden" href="https://wa.me/8801410014442" target="_blank">💳 Buy credits · WhatsApp</a>

      <div class="actions">
        <button id="inject-flow" class="btn inject">🚀 Inject Flow</button>
        <button id="open-flow" class="btn primary">🌐 Open Flow</button>
      </div>
      <div id="inject-status" class="status-note"></div>
      <button id="logout-btn" class="btn ghost mt-8">Sign out</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
