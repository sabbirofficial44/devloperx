<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>DeveloperX — Veu</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  body {
    width: 300px;
    font-family: 'Outfit', -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f2f4fa;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(124,92,252,.35), transparent 60%),
      radial-gradient(120% 80% at 100% 100%, rgba(34,211,238,.28), transparent 60%),
      radial-gradient(80% 60% at 50% 120%, rgba(244,114,182,.22), transparent 60%),
      #07080c;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 12px; position: relative; }

  /* animated glow orbs */
  .orb { position:absolute; border-radius:50%; filter: blur(28px); pointer-events:none; opacity:.55; }
  .orb.a { width:180px; height:180px; top:-70px; right:-50px; background:#7c5cfc; animation: float1 9s ease-in-out infinite; }
  .orb.b { width:160px; height:160px; bottom:-70px; left:-50px; background:#22d3ee; animation: float2 11s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-16px,18px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(14px,-16px)} }

  .brand { display:flex; align-items:center; gap:10px; margin-bottom:10px; position:relative; }
  .brand .logo {
    width:32px; height:32px; border-radius:10px;
    background: conic-gradient(from 210deg, #7c5cfc, #22d3ee, #f472b6, #7c5cfc);
    display:grid; place-items:center; font-weight:900; color:#08090d; font-size:15px;
    box-shadow: 0 6px 20px rgba(124,92,252,.55), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .brand h1 { font-size: 13px; margin: 0; font-weight: 800; letter-spacing:-.2px; line-height:1.15; }
  .brand small { color: #a2acc0; font-size: 10px; font-weight:500; }

  .card {
    position:relative;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 16px;
    padding: 12px;
    backdrop-filter: blur(22px) saturate(160%);
    box-shadow:
      0 12px 40px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .card::after{
    content:""; position:absolute; inset:0; border-radius:16px; pointer-events:none;
    background: linear-gradient(120deg, rgba(124,92,252,.25), transparent 40%, rgba(34,211,238,.2));
    opacity:.35; mix-blend-mode: overlay;
  }

  label { display:block; font-size:9px; color:#a2acc0; margin:8px 0 4px; text-transform:uppercase; letter-spacing:.8px; font-weight:700; }
  input {
    width:100%; padding:9px 11px; font-size:12px;
    background: rgba(0,0,0,.42); color:#f2f4fa;
    border:1px solid rgba(255,255,255,.10); border-radius:9px; outline:none;
    transition: border .2s, box-shadow .2s;
    font-family:inherit;
  }
  input:focus { border-color:#7c5cfc; box-shadow:0 0 0 3px rgba(124,92,252,.25); }

  .btn {
    width:100%; padding:10px; font-size:12px; font-weight:800; letter-spacing:.3px;
    border:0; border-radius:10px; cursor:pointer; font-family:inherit;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s;
    color:#fff;
  }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn.primary {
    background: linear-gradient(135deg,#7c5cfc,#5a3fe0);
    box-shadow: 0 6px 20px rgba(124,92,252,.45), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn.primary:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(124,92,252,.6); }
  .btn.inject {
    background: linear-gradient(135deg,#22d3ee,#0891b2);
    box-shadow: 0 6px 20px rgba(34,211,238,.4), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn.inject:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(34,211,238,.6); }
  .btn.ghost {
    background: rgba(255,255,255,.05); color:#e4e7ee;
    border:1px solid rgba(255,255,255,.12); font-weight:700;
    box-shadow: none;
  }
  .btn.ghost:hover { background: rgba(255,255,255,.09); }

  .mt-8 { margin-top:8px; }
  .mt-10{ margin-top:10px; }

  .err { color:#f87171; font-size:11px; margin-top:6px; min-height:12px; }

  .head-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .head-row .name { font-weight:800; font-size:12px; line-height:1.2; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .head-row .mail { color:#8a93a7; font-size:10px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge {
    display:inline-block; padding:3px 8px; font-size:9px; border-radius:999px;
    background: rgba(124,92,252,.22); color:#c4b5fd;
    text-transform:uppercase; font-weight:800; letter-spacing:.6px;
    border:1px solid rgba(124,92,252,.35);
  }
  .badge.warn { background:rgba(240,185,11,.18); color:#fbbf24; border-color:rgba(240,185,11,.35); }
  .badge.danger { background:rgba(239,68,68,.22); color:#f87171; border-color:rgba(239,68,68,.35); }
  .badge.ok { background:rgba(34,211,153,.18); color:#34d399; border-color:rgba(34,197,153,.35); }

  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .kpi > div {
    padding:9px 10px; border-radius:12px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    position:relative; overflow:hidden;
  }
  .kpi > div::before{
    content:""; position:absolute; inset:-1px; border-radius:12px; pointer-events:none;
    background: linear-gradient(120deg, rgba(124,92,252,.25), transparent 60%);
    opacity:.6;
  }
  .kpi .t { position:relative; font-size:9px; color:#a2acc0; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  .kpi .v {
    position:relative; font-size:16px; font-weight:800; margin-top:2px; letter-spacing:-.4px;
    font-variant-numeric: tabular-nums;
  }
  .kpi .v.glow { text-shadow: 0 0 12px rgba(124,92,252,.6); }
  .kpi .v.time { font-size:15px; color:#22d3ee; text-shadow: 0 0 10px rgba(34,211,238,.55); }

  .pbar { width:100%; height:5px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; margin-top:10px; }
  .pbar > i { display:block; height:100%; background:linear-gradient(90deg,#7c5cfc,#22d3ee,#f472b6); background-size:200% 100%; transition:width .5s; animation: shimmer 3s linear infinite; }
  @keyframes shimmer { 0%{background-position:0 0} 100%{background-position:200% 0} }

  .cta {
    display:block; margin-top:10px; padding:9px;
    background: linear-gradient(135deg,#f0b90b,#ea8b0b);
    color:#08090d; border-radius:10px; text-align:center; font-weight:800;
    text-decoration:none; font-size:11px;
    box-shadow: 0 6px 18px rgba(240,185,11,.35);
  }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }

  .hidden { display:none !important; }
  .status-note { font-size:10.5px; color:#a2acc0; margin-top:6px; min-height:12px; text-align:center; }

  /* live dot */
  .live { display:inline-flex; align-items:center; gap:5px; font-size:9px; color:#34d399; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .live .dot { width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 8px #34d399; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.4; transform:scale(.85)} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="orb a"></div>
    <div class="orb b"></div>

    <div class="brand">
      <div class="logo">D</div>
      <div>
        <h1>DeveloperX · Veu</h1>
        <small>Google Flow · Managed</small>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="view-login" class="card">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button id="login-btn" class="btn primary mt-10">Sign in</button>
      <div id="login-err" class="err"></div>
      <input id="api-base" type="hidden" />
    </div>

    <!-- STATUS -->
    <div id="view-status" class="card hidden">
      <div class="head-row">
        <div style="min-width:0">
          <div id="s-name" class="name">—</div>
          <div id="s-email" class="mail">—</div>
        </div>
        <span id="s-plan" class="badge">basic</span>
      </div>

      <div class="kpi">
        <div>
          <div class="t">Credits</div>
          <div class="v glow" id="s-credits">—</div>
        </div>
        <div>
          <div class="t">
            <span class="live"><span class="dot"></span> Live time</span>
          </div>
          <div class="v time" id="s-time">--:--:--</div>
        </div>
      </div>
      <div class="pbar"><i id="s-bar" style="width:0%"></i></div>

      <div id="s-alert" class="err" style="color:#fbbf24"></div>

      <a id="s-upgrade" class="cta hidden" href="https://wa.me/8801410014442" target="_blank">💳 Buy credits · WhatsApp</a>

      <div class="actions">
        <button id="inject-flow" class="btn inject">🚀 Inject Flow</button>
        <button id="open-flow" class="btn primary">🌐 Open Flow</button>
      </div>
      <div id="inject-status" class="status-note"></div>
      <button id="logout-btn" class="btn ghost mt-8">Sign out</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
